# OE test wallet: dev wallet frontend + wallet API (docker compose project "wallet-test-oe")
# Install: copy to /etc/nginx/sites-available/, link into sites-enabled/, then run
#   certbot --nginx -d wallet.test-oe.delta-dao.com --redirect
# which adds the HTTPS server block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name wallet.test-oe.delta-dao.com;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 120s;

    # Wallet API (container wallet-api-oe)
    location /wallet-api/ {
        proxy_pass http://127.0.0.1:7011;
    }

    # Dev wallet frontend (container dev-wallet-oe)
    location / {
        proxy_pass http://127.0.0.1:7114;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
